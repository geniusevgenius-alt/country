<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Схема участка 40х20м</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        #info { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; pointer-events: none; max-width: 400px; line-height: 1.4; z-index: 10; }
        .legend { margin-top: 8px; font-size: 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    </style>
    
    <!-- Всего одна монолитная библиотека, в которой ЕСТЬ ВСЕ, включая управление мышью -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="info">
        <strong>Интерактивный 3D план участка (40х20м)</strong><br>
        <small style="color: #bbb;">Управление: ЛКМ — вращение | Колесико — зум</small>
        <div class="legend">
            <div><span style="color:#346b2b">■</span> Газон (20х40м)</div>
            <div><span style="color:#5d4037">■</span> Дом (D28:K35)</div>
            <div><span style="color:#ffb74d">■</span> Беседка (F23:J26)</div>
            <div><span style="color:#ba68c8">■</span> Бытовка (R3:S4)</div>
            <div><span style="color:#4dd0e1">■</span> Теплица (C3:D6)</div>
            <div><span style="color:#f06292">■</span> Туалет (F3)</div>
            <div><span style="color:#1976d2">■</span> Каналы / Вода</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            // 1. Создание сцены
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // 2. Создание рендерера
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 3. Настройка камеры
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(10, 32, 52); 

            // 4. Простейшее встроенное управление (без OrbitControls)
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };
            let theta = 0; // угол вращения вокруг центра
            let phi = Math.PI / 4; // угол наклона
            const radius = 55; // дистанция камеры от центра
            const target = new THREE.Vector3(10, 0, 20); // центр участка

            function updateCameraPosition() {
                camera.position.x = target.x + radius * Math.sin(theta) * Math.cos(phi);
                camera.position.y = target.y + radius * Math.sin(phi);
                camera.position.z = target.z + radius * Math.cos(theta) * Math.cos(phi);
                camera.lookAt(target);
            }
            updateCameraPosition();

            // Обработчики мыши для вращения сцены
            window.addEventListener('mousedown', (e) => { isDragging = true; });
            window.addEventListener('mousemove', (e) => {
                const deltaMove = { x: e.offsetX - previousMousePosition.x, y: e.offsetY - previousMousePosition.y };
                if (isDragging) {
                    theta -= deltaMove.x * 0.007;
                    phi = Math.max(0.1, Math.min(Math.PI / 2.1, phi + deltaMove.y * 0.007));
                    updateCameraPosition();
                }
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            });
            window.addEventListener('mouseup', () => { isDragging = false; });

            // 5. Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.45);
            sunLight.position.set(25, 45, 15);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // 6. Основание (Газон 20х40м)
            const groundGeo = new THREE.PlaneGeometry(20, 40);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x346b2b, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(10, 0, 20); 
            ground.receiveShadow = true;
            scene.add(ground);

            // Измерительная сетка
            const gridHelper = new THREE.GridHelper(40, 40, 0x333333, 0x555555);
            gridHelper.position.set(10, 0.01, 20);
            scene.add(gridHelper);

            // 7. Функция строительства объектов по сетке
            function buildStructure(name, color, colStart, rowStart, colEnd, rowEnd, height) {
                const width = (colEnd - colStart) + 1; 
                const depth = (rowEnd - rowStart) + 1; 
                
                const geometry = new THREE.BoxGeometry(width, height, depth);
                const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.55 });
                const mesh = new THREE.Mesh(geometry, material);
                
                const posX = (colStart - 1) + width / 2;
                const posZ = (rowStart - 1) + depth / 2;
                const posY = height / 2;
                
                mesh.position.set(posX, posY, posZ);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                
                const edges = new THREE.EdgesGeometry(geometry);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.2, transparent: true }));
                line.position.copy(mesh.position);
                scene.add(line);
            }

            // 8. Функция построения каналов
            function buildChannel(colStart, rowStart, colEnd, rowEnd) {
                const width = (colEnd - colStart) + 1;
                const depth = (rowEnd - rowStart) + 1;
                const geometry = new THREE.PlaneGeometry(width, depth);
                const material = new THREE.MeshStandardMaterial({ color: 0x1976d2, roughness: 0.1 });
                const water = new THREE.Mesh(geometry, material);
                water.rotation.x = -Math.PI / 2;
                
                const posX = (colStart - 1) + width / 2;
                const posZ = (rowStart - 1) + depth / 2;
                water.position.set(posX, 0.02, posZ); 
                scene.add(water);
            }

            // Расстановка объектов по координатам
            buildStructure('Дом', 0x5d4037, 4, 28, 11, 35, 4.5);      // D28:K35
            buildStructure('Беседка', 0xffb74d, 6, 23, 10, 26, 2.5);  // F23:J26
            buildStructure('Теплица', 0x4dd0e1, 3, 3, 4, 6, 2);       // C3:D6
            buildStructure('Бытовка', 0xba68c8, 18, 3, 19, 4, 2.5);    // R3:S4
            buildStructure('Туалет', 0xf06292, 6, 3, 6, 3, 2.2);       // F3

            // Водные каналы по периметру
            buildChannel(1, 1, 1, 41);    
            buildChannel(20, 1, 20, 39);  
            buildChannel(2, 1, 19, 1);    
            buildChannel(2, 40, 19, 40);  

            // 9. Простой анимационный цикл
            function animate() {
                requestAnimationFrame(animate);
                renderer.render(scene, camera);
            }
            animate();

            // Адаптивность окна браузера
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                updateCameraPosition();
            });
        }
    </script>
</body>
</html>
