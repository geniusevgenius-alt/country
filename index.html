<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Схема участка 40х20м</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        #info { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: #ffffff; 
            background: rgba(0,0,0,0.85); 
            padding: 14px 18px; 
            border-radius: 8px; 
            pointer-events: none; 
            max-width: 420px; 
            line-height: 1.4; 
            z-index: 10; 
        }
        .legend { 
            margin-top: 8px; 
            font-size: 13px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 4px 12px; 
        }
    </style>
    <!-- Только одна базовая стабильная библиотека Three.js, работающая на всех серверах -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="info">
        <strong>Интерактивный 3D план участка (40х20м)</strong><br>
        <small style="color: #bbb;">ЛКМ — вращение | ПКМ — смещение | Колесико — зум</small>
        <div class="legend">
            <div><span style="color:#3e7d32">■</span> Газон (20х40м)</div>
            <div><span style="color:#708090">■</span> Дом + Двускатная крыша</div>
            <div><span style="color:#cd853f">■</span> Беседка с опорами</div>
            <div><span style="color:#ba68c8">■</span> Бытовка (R3:S4)</div>
            <div><span style="color:#4dd0e1">■</span> Теплица (C3:D6)</div>
            <div><span style="color:#f06292">■</span> Туалет (F3)</div>
            <div><span style="color:#1e88e5">■</span> Каналы / Вода</div>
        </div>
    </div>

    <script>
        // 1. Сцена и Рендерер
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x181818);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 2. Камера
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);

        // 3. Встроенный надежный контроллер камеры (Вращение + Зум + Сдвиг)
        let radius = 60;
        let theta = 0.5;  // горизонтальный угол
        let phi = 0.7;    // вертикальный угол
        const target = new THREE.Vector3(10, 0, 20); // Центр участка (X=10, Z=20)

        function updateCamera() {
            phi = Math.max(0.05, Math.min(Math.PI / 2.05, phi));
            radius = Math.max(8, Math.min(150, radius));
            camera.position.x = target.x + radius * Math.sin(phi) * Math.sin(theta);
            camera.position.y = target.y + radius * Math.cos(phi);
            camera.position.z = target.z + radius * Math.sin(phi) * Math.cos(theta);
            camera.lookAt(target);
        }
        updateCamera();

        // Управление мышью
        let isMouseDown = false;
        let mouseButton = 0;
        let prevMouseX = 0;
        let prevMouseY = 0;

        window.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('mousedown', e => {
            isMouseDown = true;
            mouseButton = e.button;
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
        });

        window.addEventListener('mousemove', e => {
            if (!isMouseDown) return;
            const dx = e.clientX - prevMouseX;
            const dy = e.clientY - prevMouseY;

            if (mouseButton === 0) {
                // ЛКМ: вращение
                theta -= dx * 0.008;
                phi -= dy * 0.008;
            } else if (mouseButton === 2) {
                // ПКМ: панорамирование (смещение фокуса)
                const forward = new THREE.Vector3().subVectors(target, camera.position).normalize();
                const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
                target.addScaledVector(right, -dx * 0.04);
                target.y += dy * 0.04;
            }
            prevMouseX = e.clientX;
            prevMouseY = e.clientY;
            updateCamera();
        });

        window.addEventListener('mouseup', () => { isMouseDown = false; });

        // Зум колесиком мыши
        window.addEventListener('wheel', e => {
            radius += e.deltaY * 0.05;
            updateCamera();
        }, { passive: true });

        // 4. Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.65);
        sunLight.position.set(25, 45, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.25);
        fillLight.position.set(-25, 25, -20);
        scene.add(fillLight);

        // 5. Газон 20х40м
        const groundGeo = new THREE.PlaneGeometry(20, 40);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x3e7d32, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(10, 0, 20);
        ground.receiveShadow = true;
        scene.add(ground);

        // Сетка 1х1 метр
        const gridHelper = new THREE.GridHelper(40, 40, 0x224422, 0x224422);
        gridHelper.position.set(10, 0.01, 20);
        scene.add(gridHelper);

        function addOutline(geometry, meshPosition) {
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(
                edges,
                new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.25, transparent: true })
            );
            line.position.copy(meshPosition);
            scene.add(line);
        }

        // 6. Базовая коробка (Бытовка, Туалет)
        function buildBox(colStart, rowStart, colEnd, rowEnd, height, color) {
            const width = (colEnd - colStart) + 1;
            const depth = (rowEnd - rowStart) + 1;
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
            const mesh = new THREE.Mesh(geo, mat);

            const posX = (colStart - 1) + width / 2;
            const posZ = (rowStart - 1) + depth / 2;
            mesh.position.set(posX, height / 2, posZ);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            addOutline(geo, mesh.position);
        }

        // 7. Дом с двускатной крышей
        function buildHouse(colStart, rowStart, colEnd, rowEnd) {
            const width = (colEnd - colStart) + 1;
            const depth = (rowEnd - rowStart) + 1;
            const wallH = 3.2;
            const roofH = 1.8;

            const posX = (colStart - 1) + width / 2;
            const posZ = (rowStart - 1) + depth / 2;

            // Стены дома
            const wallGeo = new THREE.BoxGeometry(width, wallH, depth);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x708090, roughness: 0.5 });
            const walls = new THREE.Mesh(wallGeo, wallMat);
            walls.position.set(posX, wallH / 2, posZ);
            walls.castShadow = true;
            walls.receiveShadow = true;
            scene.add(walls);
            addOutline(wallGeo, walls.position);

            // Крыша
            const radius = width / Math.sqrt(3);
            const roofGeo = new THREE.CylinderGeometry(radius, radius, depth, 3);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x2f4f4f, roughness: 0.4 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.rotation.x = Math.PI / 2;
            roof.rotation.z = Math.PI / 6;
            roof.scale.set(1, roofH / 1.5, 1);
            roof.position.set(posX, wallH + roofH / 2, posZ);
            roof.castShadow = true;
            scene.add(roof);
        }

        // 8. Беседка
        function buildGazebo(colStart, rowStart, colEnd, rowEnd) {
            const width = (colEnd - colStart) + 1;
            const depth = (rowEnd - rowStart) + 1;
            const height = 2.4;
            const posX = (colStart - 1) + width / 2;
            const posZ = (rowStart - 1) + depth / 2;

            buildBox(colStart, rowStart, colEnd, rowEnd, 0.15, 0x8b5a2b);

            const roofGeo = new THREE.BoxGeometry(width + 0.3, 0.2, depth + 0.3);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xcd853f });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(posX, height, posZ);
            roof.castShadow = true;
            scene.add(roof);

            const postGeo = new THREE.BoxGeometry(0.15, height, 0.15);
            const postMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const ox = width / 2 - 0.12;
            const oz = depth / 2 - 0.12;
            const corners = [[-ox, -oz], [ox, -oz], [-ox, oz], [ox, oz]];
            corners.forEach(([dx, dz]) => {
                const post = new THREE.Mesh(postGeo, postMat);
                post.position.set(posX + dx, height / 2, posZ + dz);
                post.castShadow = true;
                scene.add(post);
            });
        }

        // 9. Теплица
        function buildGreenhouse(colStart, rowStart, colEnd, rowEnd) {
            const width = (colEnd - colStart) + 1;
            const depth = (rowEnd - rowStart) + 1;
